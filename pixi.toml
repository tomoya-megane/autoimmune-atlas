[workspace]
authors = ["tomoya <bioinfo.megane@gmail.com>"]
channels = ["conda-forge"]
name = "autoimmune-atlas"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
start = "python app.py"
dev = "python app.py --dev"
refresh = "python -m autoimmune_atlas.refresh"
test = "python -m unittest discover -v -s tests -t ."
test-help = "node tests/test_help.cjs"
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."
typecheck = "basedpyright ."
lint-markdown = "markdownlint-cli2"
check = { depends-on = ["format-check", "lint", "typecheck", "test", "test-help"] }

[dependencies]
python = ">=3.13,<3.14"
dash = ">=4.4.1,<5"
plotly = ">=7.0.0,<8"
pandas = ">=3.0.6,<4"
scipy = ">=1.18.1,<2"
nodejs = ">=26.5.0,<26.6"
ruff = ">=0.16.1,<0.17"
basedpyright = ">=1.39.8,<2"
markdownlint-cli2 = ">=0.23.2,<0.24"
dash-ag-grid = ">=35.3.0,<36"
msgspec = ">=0.21.1,<0.22"
httpx = ">=0.28.1,<0.29"
