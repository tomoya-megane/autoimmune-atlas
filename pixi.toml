[workspace]
authors = ["tomoya <bioinfo.megane@gmail.com>"]
channels = ["conda-forge"]
name = "autoimmune-atlas"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
start = "python app.py"
dev = "python app.py --dev"
refresh = "python fetch_data.py"
test = "python -m unittest -v"
format = "../../mycompany/.pixi/envs/default/bin/ruff format ."
format-check = "../../mycompany/.pixi/envs/default/bin/ruff format --check ."
lint = "../../mycompany/.pixi/envs/default/bin/ruff check ."
lint-markdown = "../../mycompany/.pixi/envs/default/bin/markdownlint-cli2 '**/*.md' --config ../../mycompany/.markdownlint-cli2.jsonc"
lint-natural-japanese = "../../mycompany/.pixi/envs/default/bin/python ../../mycompany/.agents/skills/natural-japanese/scripts/lint.py --json"

[dependencies]
python = ">=3.14.7,<3.15"
dash = ">=4.4.1,<5"
plotly = ">=7.0.0,<8"
pandas = ">=3.0.6,<4"
scipy = ">=1.18.1,<2"
